[package]
name = "infinifan"
version = "1.0.0"
edition = "2024"
authors = ["Krejza9"]
license = "MIT"
repository = "https://github.com/Krejza9/infinifan"
description = "A small, fast replacement for Lian Li L-Connect 3 for the SL Infinity fan controller"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_plot = "0.38.0"
env_logger = "0.11.11"
flate2 = "1.1.10"
hidapi = "2.6.7"
libloading = "0.9.0"
log = "0.4.34"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Pipes", "Win32_Security_Authorization", "Wdk_Graphics_Direct3D", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[build-dependencies]
embed-resource = "3"
flate2 = "1.1.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
